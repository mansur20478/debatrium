<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debatrium — My Debates</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<nav>
  <a class="nav-brand" href="dashboard.html">Debatrium</a>
  <div class="nav-user">
    <span id="nav-email">Loading...</span>
    <button class="btn btn-outline btn-sm" onclick="handleLogout()">Log Out</button>
  </div>
</nav>

<div class="page-wide">

  <div class="section-header">
    <div class="section-title">My Debates</div>
    <a class="btn btn-primary btn-sm" href="debate.html">+ New Debate</a>
  </div>

  <div id="loading" style="text-align:center; padding:60px; color:var(--muted);">
    <div class="spinner spinner-dark" style="width:28px;height:28px;margin:0 auto 12px;"></div>
    Loading your debates...
  </div>

  <div id="debate-list" class="debate-grid" style="display:none;"></div>

  <div id="empty" class="empty-state" style="display:none;">
    <h2>No debates yet</h2>
    <p>Start your first debate and see AI agents argue it out.</p>
    <a class="btn btn-primary btn-sm" href="debate.html">Start a Debate</a>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
  let currentUser = null;

  requireAuth().then((user) => {
    currentUser = user;
    document.getElementById("nav-email").textContent = user.email;
    loadDebates(user.uid);
  });

  function handleLogout() {
    auth.signOut().then(() => { window.location.href = "index.html"; });
  }

  function loadDebates(userId) {
    debatesRef(userId).onSnapshot((snap) => {
      document.getElementById("loading").style.display = "none";

      if (snap.empty) {
        document.getElementById("empty").style.display = "";
        return;
      }

      document.getElementById("empty").style.display  = "none";
      document.getElementById("debate-list").style.display = "";

      const list = document.getElementById("debate-list");
      list.innerHTML = "";

      snap.forEach((doc) => {
        const d = doc.data();
        list.appendChild(buildCard(doc.id, d));
      });
    }, (err) => {
      document.getElementById("loading").innerHTML =
        `<div class="alert alert-error show">Failed to load debates: ${err.message}</div>`;
    });
  }

  // Debates running longer than this are considered stuck
  const STUCK_THRESHOLD_MIN = 15;

  function isStuck(d) {
    if (d.status !== "running") return false;
    if (!d.startedAt) return false;
    const startMs    = d.startedAt.toDate ? d.startedAt.toDate().getTime() : 0;
    const elapsedMin = (Date.now() - startMs) / 60000;
    return elapsedMin > STUCK_THRESHOLD_MIN;
  }

  function relativeTime(ts) {
    if (!ts) return "just now";
    const d    = ts.toDate ? ts.toDate() : new Date(ts);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60)    return "just now";
    if (diff < 3600)  return Math.floor(diff/60)   + " min ago";
    if (diff < 86400) return Math.floor(diff/3600) + " hr ago";
    return Math.floor(diff/86400) + " day(s) ago";
  }

  function buildCard(id, d) {
    const card  = document.createElement("div");
    const stuck = isStuck(d);

    card.className = "debate-card" + (stuck ? " debate-card-stuck" : "");

    let badgeClass, badgeLabel;
    if (stuck) {
      badgeClass = "badge-error";
      badgeLabel = "⚠ Stuck";
    } else {
      badgeClass = { running: "badge-running", complete: "badge-complete", error: "badge-error" }[d.status] || "badge-running";
      badgeLabel = { running: "⟳ Running",    complete: "✓ Complete",    error: "✗ Error"   }[d.status] || d.status;
    }

    const showProgress = d.status === "running" && !stuck;
    const progressInfo = showProgress
      ? `<div class="progress-bar-wrap"><div class="progress-bar" style="width:${Math.round((d.round||1) / (d.maxRounds||3) * 100)}%"></div></div>`
      : "";

    const stuckHint = stuck
      ? `<div class="stuck-hint">This debate has been running for over ${STUCK_THRESHOLD_MIN} minutes and may be stuck. You can safely delete it.</div>`
      : "";

    card.innerHTML = `
      <div class="debate-card-clickable">
        <div class="debate-card-header">
          <div class="debate-query">${escHtml(d.query)}</div>
          <span class="badge ${badgeClass}">${badgeLabel}</span>
        </div>
        ${progressInfo}
        <div class="debate-meta" style="margin-top:8px;">
          ${showProgress ? `Round ${d.round||1} of ${d.maxRounds||3} &nbsp;·&nbsp; ` : ""}
          Started ${relativeTime(d.startedAt)}
          ${d.completedAt ? ` &nbsp;·&nbsp; Completed ${relativeTime(d.completedAt)}` : ""}
        </div>
        ${stuckHint}
      </div>
      <button class="debate-card-delete" title="Delete debate">×</button>
    `;

    card.querySelector(".debate-card-clickable").addEventListener("click", () => {
      window.location.href = `debate.html?id=${id}`;
    });

    card.querySelector(".debate-card-delete").addEventListener("click", async (e) => {
      e.stopPropagation();
      const msg = stuck
        ? "Delete this stuck debate? This cannot be undone."
        : "Delete this debate? This cannot be undone.";
      if (!confirm(msg)) return;
      try {
        await deleteDebate(id);
        // Card will disappear automatically via onSnapshot
      } catch (err) {
        alert("Failed to delete: " + err.message);
      }
    });

    return card;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>
</body>
</html>
